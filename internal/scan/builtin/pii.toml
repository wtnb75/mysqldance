# Built-in rules that find personal information in the VALUE of a cell
# (B-180). Use them with:
#
#   [extend]
#   useBuiltin = ["pii"]
#   disabledRules = ["pii-ipv4"]   # to turn one off
#
# These are hints, not a guarantee: a pattern can miss a value written in a form
# it does not know, and can match something that is not personal information
# (an IPv4 address looks like a version number). A scan that finds nothing does
# not prove that the data holds no personal information.
#
# Known limits: two values of one rule that sit next to each other with a single
# separator character (03-1234-5678/03-1234-5679) are found once, since the
# separator is the boundary of both; a card number followed by more digits
# (4111111111111111 123) is not found; and pii-ipv6 matches short words such as
# a::b. A rule of the same id in your own file replaces a rule here entirely.
#
# The patterns are RE2 (no look-ahead). Where a value must not be a piece of a
# longer run of digits, the boundary is a captured non-digit (or the start or end
# of the value) around the secret, and secretGroup names the secret. No rule
# here has an allowlist with paths, so none depends on how paths are matched.

[[rules]]
id = "pii-email"
description = "Email address"
regex = '''[A-Za-z0-9._%+\-]+@[A-Za-z0-9\-]+(?:\.[A-Za-z0-9\-]+)+'''
keywords = ["@"]

[[rules]]
id = "pii-phone-jp"
description = "Japanese phone number written with hyphens"
# 0X-XXXX-XXXX, 0XX-XXX(X)-XXXX, 0XXX-XX-XXXX, 0XXXX-X-XXXX and 0120-XXX-XXX.
# Numbers without hyphens (10 or 11 digits) cannot be told from an id.
regex = '''(?:^|[^0-9\-])(0[0-9]-[0-9]{4}-[0-9]{4}|0[0-9]{2}-[0-9]{3,4}-[0-9]{4}|0[0-9]{3}-[0-9]{2}-[0-9]{4}|0[0-9]{4}-[0-9]-[0-9]{4}|0120-[0-9]{3}-[0-9]{3})(?:$|[^0-9\-])'''
secretGroup = 1
keywords = ["-"]

[[rules]]
id = "pii-phone-intl"
description = "International phone number (E.164: + and 7 to 15 digits)"
regex = '''(?:^|[^0-9A-Za-z+])(\+[1-9](?:[ \-]?[0-9]){6,14})(?:$|[^0-9])'''
secretGroup = 1
keywords = ["+"]

[[rules]]
id = "pii-postal-jp"
description = "Japanese postal code (NNN-NNNN, with or without a leading 〒)"
# Seven digits without the hyphen cannot be told from an id.
regex = '''(?:^|[^0-9\-])([0-9]{3}-[0-9]{4})(?:$|[^0-9\-])'''
secretGroup = 1
keywords = ["-"]

[[rules]]
id = "pii-credit-card"
description = "Payment card number (13 to 19 digits that pass the Luhn check)"
regex = '''(?:^|[^0-9])([0-9](?:[ \-]?[0-9]){12,18})(?:$|[^0-9])'''
secretGroup = 1
validate = "luhn"

[[rules]]
id = "pii-my-number"
description = "Japanese Individual Number (12 digits whose check digit is right)"
regex = '''(?:^|[^0-9])([0-9]{4}(?: ?[0-9]{4}){2})(?:$|[^0-9])'''
secretGroup = 1
validate = "my_number"

[[rules]]
id = "pii-ipv4"
description = "IPv4 address"
# It also matches a version number such as 1.2.3.4. There is no allowlist:
# turn the rule off with disabledRules where that is too noisy.
regex = '''(?:^|[^0-9.])((?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3})(?:$|[^0-9.]|\.(?:$|[^0-9]))'''
secretGroup = 1
keywords = ["."]

[[rules]]
id = "pii-ipv6"
description = "IPv6 address (the full form and the forms with ::)"
# A time such as 12:34:56 has no :: and fewer than 8 groups, so it does not match.
# The bare :: is left out (it is common in code).
regex = '''(?i)(?:^|[^0-9a-z:])((?:[0-9a-f]{1,4}:){7}[0-9a-f]{1,4}|(?:[0-9a-f]{1,4}:){1,7}:|(?:[0-9a-f]{1,4}:){1,6}:[0-9a-f]{1,4}|(?:[0-9a-f]{1,4}:){1,5}(?::[0-9a-f]{1,4}){1,2}|(?:[0-9a-f]{1,4}:){1,4}(?::[0-9a-f]{1,4}){1,3}|(?:[0-9a-f]{1,4}:){1,3}(?::[0-9a-f]{1,4}){1,4}|(?:[0-9a-f]{1,4}:){1,2}(?::[0-9a-f]{1,4}){1,5}|[0-9a-f]{1,4}:(?::[0-9a-f]{1,4}){1,6}|:(?::[0-9a-f]{1,4}){1,7})(?:$|[^0-9a-z:])'''
secretGroup = 1
keywords = [":"]
