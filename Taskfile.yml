version: "3"

tasks:
  default:
    cmds:
      - task -l --sort=alphanumeric
  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  # Unit tests with the race detector (needs cgo and a C compiler).
  test:race:
    desc: Run unit tests with the race detector
    cmds:
      - go test -race ./...

  # Writes the profile to COVER (default coverage.out, ignored by git) and
  # prints the per-function summary.
  test:cover:
    desc: Run unit tests with coverage and print the per-function summary
    vars:
      COVER: '{{.COVER | default "coverage.out"}}'
    cmds:
      - go test -coverprofile={{.COVER}} ./...
      - go tool cover -func={{.COVER}}

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  fmt:
    desc: Format Go sources
    cmds:
      - go fmt ./...
      - go fix ./...

  check:
    desc: Run fmt (go fmt, go fix), lint, unit tests and build in order
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: build

  # Builds ./mysqldance (ignored by git) for the current platform, with the
  # version and commit embedded as goreleaser does. Pass OUT=path to change
  # the output file.
  build:
    desc: Build the mysqldance binary for this platform into ./mysqldance
    vars:
      OUT: '{{.OUT | default "mysqldance"}}'
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev
      COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}} -X main.commit={{.COMMIT}}" -o {{.OUT}} ./cmd/mysqldance

  # Installs into $GOBIN (or $GOPATH/bin) with the same version info as build.
  install:
    desc: Install mysqldance into GOBIN with the version embedded
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev
      COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
    cmds:
      - go install -ldflags "-X main.version={{.VERSION}} -X main.commit={{.COMMIT}}" ./cmd/mysqldance

  # Passes everything after `--` to mysqldance: task run -- --version
  run:
    desc: Run mysqldance with the arguments given after `--`
    cmds:
      - go run ./cmd/mysqldance {{.CLI_ARGS}}

  # Removes only the build outputs named here, and only if git ignores them.
  clean:
    desc: Remove build outputs (./mysqldance, dist/, dump/, coverage.out) that git ignores
    cmds:
      - git clean -fdX -- mysqldance dist dump coverage.out

  snapshot:
    desc: Build binaries for all platforms into dist/ without releasing
    cmds:
      - goreleaser build --snapshot --clean

  update:
    desc: update dependencies
    cmds:
      - go get -u ./...

  # Backlog helpers. BACKLOG.md format: see .claude/skills/mgmt-backlog.
  #   FILE  backlog file (default BACKLOG.md)
  #   N     number of candidates shown by backlog:next (default 5)
  backlog:stats:
    desc: Show backlog item counts per priority and status
    vars:
      FILE: '{{.FILE | default "BACKLOG.md"}}'
    preconditions:
      - sh: test -f {{.FILE}}
        msg: "{{.FILE}} not found"
    cmds:
      - awk -v mode=stats -f scripts/backlog.awk {{.FILE}}

  backlog:next:
    desc: Show the top todo candidates (highest priority, lowest ID first) and items blocked by dependencies
    vars:
      FILE: '{{.FILE | default "BACKLOG.md"}}'
      N: '{{.N | default "5"}}'
    preconditions:
      - sh: test -f {{.FILE}}
        msg: "{{.FILE}} not found"
    cmds:
      - echo "== next candidates (first one is picked automatically) =="
      - awk -v mode=ready -f scripts/backlog.awk {{.FILE}} | sort | head -n {{.N}}
      - echo "== blocked (unmet dependencies) =="
      - awk -v mode=blocked -f scripts/backlog.awk {{.FILE}} | sort

  # Sample data for trying mysqldance by hand: scripts/sample/*.sql is loaded
  # into a MySQL container, in file name order. Overridable variables:
  #   VERSION   MySQL image tag (default 8.4; 8.0 also works)
  #   PORT      host port published for MySQL (default 33071)
  #   NAME      container name (default mysqldance-sample)
  #   TIMEOUT   seconds to wait for the server to accept TCP (default 180)
  # The files are fed through `docker exec -i`, so the Docker daemon may run
  # on another host.
  # Starts the container and waits until MySQL answers; shared by sample:up and
  # sample:big. Not meant to be called on its own.
  sample:start:
    internal: true
    vars:
      VERSION: '{{.VERSION | default "8.4"}}'
      PORT: '{{.PORT | default "33071"}}'
      NAME: '{{.NAME | default "mysqldance-sample"}}'
      TIMEOUT: '{{.TIMEOUT | default "180"}}'
    cmds:
      - docker rm -fv {{.NAME}} >/dev/null 2>&1 || true
      - docker run -d --name {{.NAME}} -e MYSQL_ROOT_PASSWORD=root -p 127.0.0.1:{{.PORT}}:3306 mysql:{{.VERSION}} --character-set-server=utf8mb4
      - |
        echo "waiting for MySQL {{.VERSION}}..."
        i=0
        until docker exec {{.NAME}} mysqladmin ping -h 127.0.0.1 -uroot -proot --silent >/dev/null 2>&1; do
          i=$((i + 1))
          if [ "$i" -ge {{.TIMEOUT}} ]; then
            echo "MySQL {{.VERSION}} did not become ready within {{.TIMEOUT}}s" >&2
            docker logs --tail 20 {{.NAME}} >&2
            docker rm -fv {{.NAME}} >/dev/null 2>&1 || true
            exit 1
          fi
          sleep 1
        done

  sample:up:
    desc: Start MySQL (VERSION=8.4 by default) in Docker and load scripts/sample/*.sql
    vars:
      VERSION: '{{.VERSION | default "8.4"}}'
      PORT: '{{.PORT | default "33071"}}'
      NAME: '{{.NAME | default "mysqldance-sample"}}'
      TIMEOUT: '{{.TIMEOUT | default "180"}}'
    cmds:
      - task: sample:start
        vars: {VERSION: '{{.VERSION}}', PORT: '{{.PORT}}', NAME: '{{.NAME}}', TIMEOUT: '{{.TIMEOUT}}'}
      - |
        for f in scripts/sample/*.sql; do
          echo "loading $f"
          docker exec -i {{.NAME}} mysql -uroot -proot --default-character-set=utf8mb4 < "$f" || { docker rm -fv {{.NAME}} >/dev/null 2>&1 || true; exit 1; }
        done
      - 'echo "sample data ready: MYSQL_PWD=root go run ./cmd/mysqldance -h 127.0.0.1 -P {{.PORT}} -u root -o ./dump sample_main sample_second サンプル"'

  # Big tables for measuring performance: scripts/sample-big/big.sql generates
  # them on the server from the row number alone, so the same variables always
  # give the same data. Variables:
  #   ROWS        rows per table (default 100000)
  #   ROWSIZE     short (small rows), large (rows with a BLOB) or both (default both)
  #   BLOB_BYTES  size of the BLOB column of the large tables (default 1024)
  #   VERSION, PORT, NAME, TIMEOUT as in sample:up, but the defaults are
  #   PORT=33072 and NAME=mysqldance-sample-big
  # Remove the container with `task sample:down NAME=mysqldance-sample-big`.
  sample:big:
    desc: Start MySQL in Docker and generate big tables (ROWS=100000, ROWSIZE=short|large|both)
    vars:
      VERSION: '{{.VERSION | default "8.4"}}'
      PORT: '{{.PORT | default "33072"}}'
      NAME: '{{.NAME | default "mysqldance-sample-big"}}'
      TIMEOUT: '{{.TIMEOUT | default "180"}}'
      ROWS: '{{.ROWS | default "100000"}}'
      ROWSIZE: '{{.ROWSIZE | default "both"}}'
      BLOB_BYTES: '{{.BLOB_BYTES | default "1024"}}'
    preconditions:
      - sh: 'case "{{.ROWS}}" in ""|*[!0-9]*|0*) exit 1;; esac'
        msg: "ROWS must be a positive integer, got {{.ROWS}}"
      - sh: 'case "{{.BLOB_BYTES}}" in ""|*[!0-9]*|0*) exit 1;; esac'
        msg: "BLOB_BYTES must be a positive integer, got {{.BLOB_BYTES}}"
      - sh: 'case "{{.ROWSIZE}}" in short|large|both) ;; *) exit 1;; esac'
        msg: "ROWSIZE must be short, large or both, got {{.ROWSIZE}}"
    cmds:
      - task: sample:start
        vars: {VERSION: '{{.VERSION}}', PORT: '{{.PORT}}', NAME: '{{.NAME}}', TIMEOUT: '{{.TIMEOUT}}'}
      - |
        short=0; large=0
        case "{{.ROWSIZE}}" in short) short=1;; large) large=1;; both) short=1; large=1;; esac
        echo "generating {{.ROWS}} rows per table ({{.ROWSIZE}})..."
        start=$(date +%s)
        { echo "SET @rows={{.ROWS}}, @blob_bytes={{.BLOB_BYTES}}, @short=$short, @large=$large;"; cat scripts/sample-big/big.sql; } \
          | docker exec -i {{.NAME}} mysql -uroot -proot --default-character-set=utf8mb4 \
          || { docker rm -fv {{.NAME}} >/dev/null 2>&1 || true; exit 1; }
        echo "generated in $(( $(date +%s) - start )) s"
      - 'echo "big sample ready: MYSQL_PWD=root go run ./cmd/mysqldance -h 127.0.0.1 -P {{.PORT}} -u root -o ./dump sample_big"'

  sample:down:
    desc: Remove the container started by sample:up
    vars:
      NAME: '{{.NAME | default "mysqldance-sample"}}'
    cmds:
      - docker rm -fv {{.NAME}} >/dev/null 2>&1 || true

  # Creates the sample twice from scratch, dumps each, and fails unless every
  # file is byte for byte the same.
  sample:verify:
    desc: Create the sample twice, dump both and check that the dumps are identical
    vars:
      PORT: '{{.PORT | default "33071"}}'
      NAME: '{{.NAME | default "mysqldance-sample"}}'
      HOST: '{{.HOST | default .MYSQLDANCE_TEST_HOST | default "127.0.0.1"}}'
    cmds:
      - defer: task sample:down NAME={{.NAME}}
      - task: sample:up
      - |
        out="$(mktemp -d)"
        MYSQL_PWD=root go run ./cmd/mysqldance -h {{.HOST}} -P {{.PORT}} -u root -o "$out/1" sample_main sample_second サンプル
        task sample:up
        MYSQL_PWD=root go run ./cmd/mysqldance -h {{.HOST}} -P {{.PORT}} -u root -o "$out/2" sample_main sample_second サンプル
        diff -r "$out/1" "$out/2"
        echo "the two dumps are identical ($(ls "$out/1" | wc -l) files, in $out)"

  # Overridable variables (pass on the command line, e.g.
  # `task test:integration PORT=33999 HOST=host.docker.internal`):
  #   PORT      host port published for MySQL (default 33061)
  #   HOST      address the tests dial to reach that port (default 127.0.0.1;
  #             use host.docker.internal when the Docker daemon runs elsewhere).
  #             Falls back to the MYSQLDANCE_TEST_HOST environment variable, so
  #             a per-user setting survives new worktrees.
  #   PG_PORT   host port published for PostgreSQL (default 33062)
  #   PG_IMAGE  PostgreSQL image to start (default postgres:17)
  #   NAME     container name (default mysqldance-test; PostgreSQL gets the
  #             same name plus -pg)
  #   TIMEOUT   seconds to wait for the server to accept TCP (default 180)
  #   TESTFLAGS extra `go test` flags, e.g. TESTFLAGS=-v
  # A PostgreSQL 17 container is started next to each MySQL one, for the tests
  # of --target postgres.
  test:integration:
    desc: Run tests against MySQL 8.0 and 8.4 (and PostgreSQL 17) started via Docker
    cmds:
      - task: test:integration:one
        vars: { VERSION: "8.0" }
      - task: test:integration:one
        vars: { VERSION: "8.4" }

  # PostgreSQL 14 to 18 are not part of test:integration (which checks 17 only):
  # run this when the PostgreSQL writer changes. Each version runs the tests of
  # --target postgres against MySQL 8.4 (the source). Pass PG_VERSIONS="15 16"
  # to pick versions, and TESTFLAGS to run other tests.
  test:integration:postgres:
    desc: Run the --target postgres tests against PostgreSQL 14 to 18 (MySQL 8.4 as the source) started via Docker
    vars:
      PG_VERSIONS: '{{.PG_VERSIONS | default "14 15 16 17 18"}}'
      TESTFLAGS: '{{.TESTFLAGS | default "-run Postgres"}}'
    cmds:
      - for: { var: PG_VERSIONS, split: " " }
        task: test:integration:one
        vars:
          VERSION: "8.4"
          PG_IMAGE: "postgres:{{.ITEM}}"
          TESTFLAGS: "{{.TESTFLAGS}}"

  # MariaDB is not part of test:integration: run it when the dialect, the
  # session settings or the catalog queries change. The whole suite runs; the
  # tests written in MySQL's SHOW CREATE or JSON text skip themselves.
  test:integration:mariadb:
    desc: Run tests against MariaDB 10.11 and 11.4 (and PostgreSQL 17) started via Docker
    cmds:
      - task: test:integration:one
        vars: { IMAGE: "mariadb:10.11", ROOT_ENV: MARIADB_ROOT_PASSWORD, ADMIN: mariadb-admin, VERSION: "10.11" }
      - task: test:integration:one
        vars: { IMAGE: "mariadb:11.4", ROOT_ENV: MARIADB_ROOT_PASSWORD, ADMIN: mariadb-admin, VERSION: "11.4" }

  # MySQL 5.7 is not part of test:integration either: run it when the dialect,
  # the session settings or the catalog queries change. Only 5.7.44 is checked.
  # The image exists for linux/amd64 only, so it runs under emulation on an
  # arm64 Docker host (slow to start; hence the longer TIMEOUT).
  #   - The server runs with utf8mb4 (its default is latin1, which cannot hold
  #     the test data); the tests of the latin1 default create their own
  #     latin1 database.
  #   - GODEBUG=tlsrsakex=1: the 5.7 image offers only TLS_RSA_* cipher suites,
  #     which Go 1.22 and later do not enable, so the default --ssl-mode
  #     (preferred) fails with "tls: handshake failure" without it.
  #   - A MySQL 8.4 server is started next to it (RESTORE_IMAGE) for the test
  #     that restores a 5.7 dump into 8.4.
  # Set VERSION=5.7.21 to run the same suite on 5.7.21 (no
  # show_create_table_verbosity) with --ssl-mode disabled; the two tests of TLS
  # itself fail there.
  test:integration:mysql57:
    desc: Run tests against MySQL 5.7.44 (and 8.4 for the restore test, PostgreSQL 17) started via Docker
    vars:
      VERSION: '{{.VERSION | default "5.7.44"}}'
    cmds:
      - task: test:integration:one
        vars:
          IMAGE: "mysql:{{.VERSION}}"
          VERSION: "{{.VERSION}}"
          PLATFORM: "linux/amd64"
          TIMEOUT: "600"
          SERVER_ARGS: "--character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci"
          GODEBUG: "tlsrsakex=1"
          # 5.7.21 offers TLS 1.1 at most, below the TLS 1.2 the tool requires.
          SSL_MODE: '{{if eq .VERSION "5.7.21"}}disabled{{end}}'
          RESTORE_IMAGE: "mysql:8.4"

  # MySQL 5.6 is not part of test:integration either: run it when the dialect,
  # the session settings or the catalog queries change. Only 5.6.51 (the last
  # image) is checked. It reads with the dialect of 5.7, so the whole suite
  # runs, and the tests written for 8.x or for 5.7 only skip themselves.
  # The image exists for linux/amd64 only (slow to start on arm64).
  #   - The server runs with utf8mb4, as in test:integration:mysql57.
  #   - The official 5.6 image starts with TLS disabled (no certificate is
  #     generated), so the default --ssl-mode (preferred) falls back to plain
  #     text, and the tests that need a TLS server fail or skip there.
  #   - Two runs: the whole suite restores 5.6 dumps into MySQL 8.4, then the
  #     round-trip tests of 5.6 restore them into MariaDB 10.11. The second run
  #     selects them by name (-run MySQL56), so name such a test TestMySQL56*
  #     (R-118 in docs/review-decisions.md).
  test:integration:mysql56:
    desc: Run tests against MySQL 5.6.51 (restoring into 8.4, then MariaDB 10.11; PostgreSQL 17) started via Docker
    cmds:
      - task: test:integration:one
        vars:
          IMAGE: "mysql:5.6"
          VERSION: "5.6"
          PLATFORM: "linux/amd64"
          TIMEOUT: "600"
          SERVER_ARGS: "--character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci"
          RESTORE_IMAGE: "mysql:8.4"
      - task: test:integration:one
        vars:
          IMAGE: "mysql:5.6"
          VERSION: "5.6"
          PLATFORM: "linux/amd64"
          TIMEOUT: "600"
          SERVER_ARGS: "--character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci"
          RESTORE_IMAGE: "mariadb:10.11"
          RESTORE_ROOT_ENV: MARIADB_ROOT_PASSWORD
          RESTORE_ADMIN: mariadb-admin
          TESTFLAGS: "-run MySQL56"

  test:integration:one:
    internal: true
    requires:
      vars: [VERSION]
    vars:
      # The root-password variable and the ping tool of the RESTORE_IMAGE.
      RESTORE_ROOT_ENV: '{{.RESTORE_ROOT_ENV | default "MYSQL_ROOT_PASSWORD"}}'
      RESTORE_ADMIN: '{{.RESTORE_ADMIN | default "mysqladmin"}}'
      # Set for an image that exists for one platform only (MySQL 5.7).
      PLATFORM_FLAG: '{{if .PLATFORM}}--platform {{.PLATFORM}}{{end}}'
      # Arguments for the server, GODEBUG for the test binaries, and a second
      # MySQL image to restore dumps into (MYSQLDANCE_TEST_RESTORE_DSN).
      SERVER_ARGS: '{{.SERVER_ARGS | default ""}}'
      GODEBUG_ENV: '{{if .GODEBUG}}GODEBUG={{.GODEBUG}}{{end}}'
      RESTORE_PORT: '{{.RESTORE_PORT | default "33063"}}'
      # The server image and the names of its root-password variable and its
      # ping tool; MySQL by default. The MariaDB 11 image has no mysqladmin.
      IMAGE: '{{.IMAGE | default (printf "mysql:%s" .VERSION)}}'
      ROOT_ENV: '{{.ROOT_ENV | default "MYSQL_ROOT_PASSWORD"}}'
      ADMIN: '{{.ADMIN | default "mysqladmin"}}'
      PORT: '{{.PORT | default "33061"}}'
      PG_PORT: '{{.PG_PORT | default "33062"}}'
      PG_IMAGE: '{{.PG_IMAGE | default "postgres:17"}}'
      HOST: '{{.HOST | default .MYSQLDANCE_TEST_HOST | default "127.0.0.1"}}'
      NAME: '{{.NAME | default "mysqldance-test"}}'
      TIMEOUT: '{{.TIMEOUT | default "180"}}'
    cmds:
      # Registered first so the container is removed whether a later step
      # fails or the run is interrupted.
      - defer: docker rm -fv {{.NAME}} {{.NAME}}-pg {{.NAME}}-restore >/dev/null 2>&1 || true
      - docker rm -fv {{.NAME}} {{.NAME}}-pg {{.NAME}}-restore >/dev/null 2>&1 || true
      - docker run -d {{.PLATFORM_FLAG}} --name {{.NAME}} -e {{.ROOT_ENV}}=root -p 127.0.0.1:{{.PORT}}:3306 {{.IMAGE}} {{.SERVER_ARGS}}
      - docker run -d --name {{.NAME}}-pg -e POSTGRES_PASSWORD=pg -p 127.0.0.1:{{.PG_PORT}}:5432 {{.PG_IMAGE}}
      - |
        if [ -n "{{.RESTORE_IMAGE}}" ]; then
          docker run -d --name {{.NAME}}-restore -e {{.RESTORE_ROOT_ENV}}=root -p 127.0.0.1:{{.RESTORE_PORT}}:3306 {{.RESTORE_IMAGE}}
        fi
      # The entrypoint's temporary init server has networking disabled, so a
      # TCP ping only succeeds once the real server is up.
      - |
        echo "waiting for MySQL {{.VERSION}}..."
        i=0
        until docker exec {{.NAME}} {{.ADMIN}} ping -h 127.0.0.1 -uroot -proot --silent >/dev/null 2>&1; do
          i=$((i + 1))
          if [ "$i" -ge {{.TIMEOUT}} ]; then
            echo "MySQL {{.VERSION}} did not become ready within {{.TIMEOUT}}s" >&2
            docker logs --tail 20 {{.NAME}} >&2
            exit 1
          fi
          sleep 1
        done
      # The official image restarts its server once after initializing, so
      # pg_isready is polled through TCP on the final server only.
      - |
        echo "waiting for PostgreSQL ({{.PG_IMAGE}})..."
        i=0
        until docker exec {{.NAME}}-pg pg_isready -h 127.0.0.1 -U postgres --quiet >/dev/null 2>&1; do
          i=$((i + 1))
          if [ "$i" -ge {{.TIMEOUT}} ]; then
            echo "PostgreSQL did not become ready within {{.TIMEOUT}}s" >&2
            docker logs --tail 20 {{.NAME}}-pg >&2
            exit 1
          fi
          sleep 1
        done
      - |
        if [ -n "{{.RESTORE_IMAGE}}" ]; then
          echo "waiting for the restore server {{.RESTORE_IMAGE}}..."
          i=0
          until docker exec {{.NAME}}-restore {{.RESTORE_ADMIN}} ping -h 127.0.0.1 -uroot -proot --silent >/dev/null 2>&1; do
            i=$((i + 1))
            if [ "$i" -ge {{.TIMEOUT}} ]; then
              echo "{{.RESTORE_IMAGE}} did not become ready within {{.TIMEOUT}}s" >&2
              docker logs --tail 20 {{.NAME}}-restore >&2
              exit 1
            fi
            sleep 1
          done
        fi
      - |
        restore_dsn=""
        if [ -n "{{.RESTORE_IMAGE}}" ]; then
          restore_dsn='root:root@tcp({{.HOST}}:{{.RESTORE_PORT}})/'
        fi
        env {{.GODEBUG_ENV}} MYSQLDANCE_TEST_SSL_MODE='{{.SSL_MODE}}' MYSQLDANCE_TEST_DSN='root:root@tcp({{.HOST}}:{{.PORT}})/' MYSQLDANCE_TEST_RESTORE_DSN="$restore_dsn" MYSQLDANCE_TEST_PG_DSN='postgres://postgres:pg@{{.HOST}}:{{.PG_PORT}}/postgres?sslmode=disable' go test -count=1 {{.TESTFLAGS}} ./...
