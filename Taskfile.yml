version: "3"

tasks:
  default:
    cmds:
      - task -l --sort=alphanumeric
  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  fmt:
    desc: Format Go sources
    cmds:
      - go fmt ./...
      - go fix ./...

  check:
    desc: Run fmt (go fmt, go fix), lint and unit tests in order
    cmds:
      - task: fmt
      - task: lint
      - task: test

  snapshot:
    desc: Build binaries for all platforms into dist/ without releasing
    cmds:
      - goreleaser build --snapshot --clean

  update:
    desc: update dependencies
    cmds:
      - go get -u ./...

  # Backlog helpers. BACKLOG.md format: see .claude/skills/mgmt-backlog.
  #   FILE  backlog file (default BACKLOG.md)
  #   N     number of candidates shown by backlog:next (default 5)
  backlog:stats:
    desc: Show backlog item counts per priority and status
    vars:
      FILE: '{{.FILE | default "BACKLOG.md"}}'
    preconditions:
      - sh: test -f {{.FILE}}
        msg: "{{.FILE}} not found"
    cmds:
      - awk -v mode=stats -f scripts/backlog.awk {{.FILE}}

  backlog:next:
    desc: Show the top todo candidates (highest priority, lowest ID first) and items blocked by dependencies
    vars:
      FILE: '{{.FILE | default "BACKLOG.md"}}'
      N: '{{.N | default "5"}}'
    preconditions:
      - sh: test -f {{.FILE}}
        msg: "{{.FILE}} not found"
    cmds:
      - echo "== next candidates (first one is picked automatically) =="
      - awk -v mode=ready -f scripts/backlog.awk {{.FILE}} | sort | head -n {{.N}}
      - echo "== blocked (unmet dependencies) =="
      - awk -v mode=blocked -f scripts/backlog.awk {{.FILE}} | sort

  # Overridable variables (pass on the command line, e.g.
  # `task test:integration PORT=33999 HOST=host.docker.internal`):
  #   PORT      host port published for MySQL (default 33061)
  #   HOST      address the tests dial to reach that port (default 127.0.0.1;
  #             use host.docker.internal when the Docker daemon runs elsewhere).
  #             Falls back to the MYSQLDANCE_TEST_HOST environment variable, so
  #             a per-user setting survives new worktrees.
  #   PG_PORT   host port published for PostgreSQL (default 33062)
  #   NAME      container name (default mysqldance-test; PostgreSQL gets the
  #             same name plus -pg)
  #   TIMEOUT   seconds to wait for the server to accept TCP (default 180)
  #   TESTFLAGS extra `go test` flags, e.g. TESTFLAGS=-v
  # A PostgreSQL 17 container is started next to each MySQL one, for the tests
  # of --target postgres.
  test:integration:
    desc: Run tests against MySQL 8.0 and 8.4 (and PostgreSQL 17) started via Docker
    cmds:
      - task: test:integration:one
        vars: { VERSION: "8.0" }
      - task: test:integration:one
        vars: { VERSION: "8.4" }

  # MariaDB is not part of test:integration: run it when the dialect, the
  # session settings or the catalog queries change. The whole suite runs; the
  # tests written in MySQL's SHOW CREATE or JSON text skip themselves.
  test:integration:mariadb:
    desc: Run tests against MariaDB 10.11 and 11.4 (and PostgreSQL 17) started via Docker
    cmds:
      - task: test:integration:one
        vars: { IMAGE: "mariadb:10.11", ROOT_ENV: MARIADB_ROOT_PASSWORD, ADMIN: mariadb-admin, VERSION: "10.11" }
      - task: test:integration:one
        vars: { IMAGE: "mariadb:11.4", ROOT_ENV: MARIADB_ROOT_PASSWORD, ADMIN: mariadb-admin, VERSION: "11.4" }

  # MySQL 5.7 is not part of test:integration either: run it when the dialect,
  # the session settings or the catalog queries change. Only 5.7.44 is checked.
  # The image exists for linux/amd64 only, so it runs under emulation on an
  # arm64 Docker host (slow to start; hence the longer TIMEOUT).
  #   - The server runs with utf8mb4 (its default is latin1, which cannot hold
  #     the test data); the tests of the latin1 default create their own
  #     latin1 database.
  #   - GODEBUG=tlsrsakex=1: the 5.7 image offers only TLS_RSA_* cipher suites,
  #     which Go 1.22 and later do not enable, so the default --ssl-mode
  #     (preferred) fails with "tls: handshake failure" without it.
  #   - A MySQL 8.4 server is started next to it (RESTORE_IMAGE) for the test
  #     that restores a 5.7 dump into 8.4.
  # Set VERSION=5.7.21 to run the same suite on 5.7.21 (no
  # show_create_table_verbosity) with --ssl-mode disabled; the two tests of TLS
  # itself fail there.
  test:integration:mysql57:
    desc: Run tests against MySQL 5.7.44 (and 8.4 for the restore test, PostgreSQL 17) started via Docker
    vars:
      VERSION: '{{.VERSION | default "5.7.44"}}'
    cmds:
      - task: test:integration:one
        vars:
          IMAGE: "mysql:{{.VERSION}}"
          VERSION: "{{.VERSION}}"
          PLATFORM: "linux/amd64"
          TIMEOUT: "600"
          SERVER_ARGS: "--character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci"
          GODEBUG: "tlsrsakex=1"
          # 5.7.21 offers TLS 1.1 at most, below the TLS 1.2 the tool requires.
          SSL_MODE: '{{if eq .VERSION "5.7.21"}}disabled{{end}}'
          RESTORE_IMAGE: "mysql:8.4"

  test:integration:one:
    internal: true
    requires:
      vars: [VERSION]
    vars:
      # Set for an image that exists for one platform only (MySQL 5.7).
      PLATFORM_FLAG: '{{if .PLATFORM}}--platform {{.PLATFORM}}{{end}}'
      # Arguments for the server, GODEBUG for the test binaries, and a second
      # MySQL image to restore dumps into (MYSQLDANCE_TEST_RESTORE_DSN).
      SERVER_ARGS: '{{.SERVER_ARGS | default ""}}'
      GODEBUG_ENV: '{{if .GODEBUG}}GODEBUG={{.GODEBUG}}{{end}}'
      RESTORE_PORT: '{{.RESTORE_PORT | default "33063"}}'
      # The server image and the names of its root-password variable and its
      # ping tool; MySQL by default. The MariaDB 11 image has no mysqladmin.
      IMAGE: '{{.IMAGE | default (printf "mysql:%s" .VERSION)}}'
      ROOT_ENV: '{{.ROOT_ENV | default "MYSQL_ROOT_PASSWORD"}}'
      ADMIN: '{{.ADMIN | default "mysqladmin"}}'
      PORT: '{{.PORT | default "33061"}}'
      PG_PORT: '{{.PG_PORT | default "33062"}}'
      HOST: '{{.HOST | default .MYSQLDANCE_TEST_HOST | default "127.0.0.1"}}'
      NAME: '{{.NAME | default "mysqldance-test"}}'
      TIMEOUT: '{{.TIMEOUT | default "180"}}'
    cmds:
      # Registered first so the container is removed whether a later step
      # fails or the run is interrupted.
      - defer: docker rm -fv {{.NAME}} {{.NAME}}-pg {{.NAME}}-restore >/dev/null 2>&1 || true
      - docker rm -fv {{.NAME}} {{.NAME}}-pg {{.NAME}}-restore >/dev/null 2>&1 || true
      - docker run -d {{.PLATFORM_FLAG}} --name {{.NAME}} -e {{.ROOT_ENV}}=root -p 127.0.0.1:{{.PORT}}:3306 {{.IMAGE}} {{.SERVER_ARGS}}
      - docker run -d --name {{.NAME}}-pg -e POSTGRES_PASSWORD=pg -p 127.0.0.1:{{.PG_PORT}}:5432 postgres:17
      - |
        if [ -n "{{.RESTORE_IMAGE}}" ]; then
          docker run -d --name {{.NAME}}-restore -e MYSQL_ROOT_PASSWORD=root -p 127.0.0.1:{{.RESTORE_PORT}}:3306 {{.RESTORE_IMAGE}}
        fi
      # The entrypoint's temporary init server has networking disabled, so a
      # TCP ping only succeeds once the real server is up.
      - |
        echo "waiting for MySQL {{.VERSION}}..."
        i=0
        until docker exec {{.NAME}} {{.ADMIN}} ping -h 127.0.0.1 -uroot -proot --silent >/dev/null 2>&1; do
          i=$((i + 1))
          if [ "$i" -ge {{.TIMEOUT}} ]; then
            echo "MySQL {{.VERSION}} did not become ready within {{.TIMEOUT}}s" >&2
            docker logs --tail 20 {{.NAME}} >&2
            exit 1
          fi
          sleep 1
        done
      # The official image restarts its server once after initializing, so
      # pg_isready is polled through TCP on the final server only.
      - |
        echo "waiting for PostgreSQL..."
        i=0
        until docker exec {{.NAME}}-pg pg_isready -h 127.0.0.1 -U postgres --quiet >/dev/null 2>&1; do
          i=$((i + 1))
          if [ "$i" -ge {{.TIMEOUT}} ]; then
            echo "PostgreSQL did not become ready within {{.TIMEOUT}}s" >&2
            docker logs --tail 20 {{.NAME}}-pg >&2
            exit 1
          fi
          sleep 1
        done
      - |
        if [ -n "{{.RESTORE_IMAGE}}" ]; then
          echo "waiting for the restore server {{.RESTORE_IMAGE}}..."
          i=0
          until docker exec {{.NAME}}-restore mysqladmin ping -h 127.0.0.1 -uroot -proot --silent >/dev/null 2>&1; do
            i=$((i + 1))
            if [ "$i" -ge {{.TIMEOUT}} ]; then
              echo "{{.RESTORE_IMAGE}} did not become ready within {{.TIMEOUT}}s" >&2
              docker logs --tail 20 {{.NAME}}-restore >&2
              exit 1
            fi
            sleep 1
          done
        fi
      - |
        restore_dsn=""
        if [ -n "{{.RESTORE_IMAGE}}" ]; then
          restore_dsn='root:root@tcp({{.HOST}}:{{.RESTORE_PORT}})/'
        fi
        env {{.GODEBUG_ENV}} MYSQLDANCE_TEST_SSL_MODE='{{.SSL_MODE}}' MYSQLDANCE_TEST_DSN='root:root@tcp({{.HOST}}:{{.PORT}})/' MYSQLDANCE_TEST_RESTORE_DSN="$restore_dsn" MYSQLDANCE_TEST_PG_DSN='postgres://postgres:pg@{{.HOST}}:{{.PG_PORT}}/postgres?sslmode=disable' go test -count=1 {{.TESTFLAGS}} ./...
