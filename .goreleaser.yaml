version: 2

project_name: mysqldance

before:
  hooks:
    # Required by B-032; a dirty go.mod fails the release instead of shipping.
    - go mod tidy

builds:
  - id: mysqldance
    main: ./cmd/mysqldance
    binary: mysqldance
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

dockers_v2:
  - id: default
    ids:
      - mysqldance
    dockerfile: Dockerfile
    images:
      - ghcr.io/wtnb75/mysqldance
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      # Only tag releases are published by GoReleaser. :main is pushed by
      # main.yml from a snapshot build. Empty tags are skipped, so a
      # prerelease gets no :latest.
      - '{{ .Version }}'
      - '{{ if not .Prerelease }}latest{{ end }}'

snapshot:
  version_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  sort: asc
  groups:
    # The scope may contain hyphens (this repo writes "feat(B-021): ..."), which
    # [[:word:]] does not match, so any non-")" character is allowed.
    - title: Features
      regexp: '^.*?feat(\([^)]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([^)]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - '^(docs|test|chore)(\([^)]*\))?!?:'
