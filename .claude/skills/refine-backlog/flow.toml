schema = 1
start = "decide_target"

[notes]
always = [
  "ここでは実装しない（コードを変えない）。変更は `BACKLOG.md` の対象のブロックだけ。調査の結果を設計書に残すときは、その節だけ。",
  "commit はユーザーが求めたときだけ。",
  "推測で `ready` にしない。答えが得られなかった質問が残る項目は `todo` のままにする。",
]

[states.decide_target]
prompt = """対象を決める。次のどれかで決める。`done` の項目は対象外。`ready` の項目は、ユーザーが確定し直すと言ったときだけ扱う。
- **ID の指定**（複数でもよい）: その項目。
- **条件の指定**（「5件」「P2 を全部」など）: `task backlog:next N=<件数>` の todo 欄から、条件に合うものを上から選ぶ（「全部」は `N=999`）。
- **指定なし**: `task backlog:next N=3` の todo 欄の 3 件（優先度が高く ID が小さい順）を、ID とタイトルの一覧でまとめて提案する。

blocked の項目は、提案には出さない。ID で指定されたら確定してよい。ただし、仕様が依存先の実装の結果で変わるなら、`ready` にせず、そのことを伝える。"""

[[states.decide_target.choices]]
label = "by_id"
when = "ユーザーが ID を指定した"
goto = "research"

[[states.decide_target.choices]]
label = "by_list"
when = "条件の指定、または指定なしで、選んだ一覧をユーザーに見せる必要がある"
goto = "confirm_list"

[states.confirm_list]
prompt = "選んだ一覧（ID とタイトル）をユーザーに見せ、了承を得てから調べ始める。外す項目・足す項目があれば、その場で直してもらう。"
gate = true
goto = "research"

[states.research]
prompt = """読んで調べる。項目のブロック、設計書（`docs/superpowers/specs/`）の関連する節、関連コードを読む。
台帳（`docs/review-decisions.md`）は全文を読まず、関連するファイル名や関数名で `rg` し、当たった項目だけを読む。
完了した項目の仕様が要るときは、`rg -n -A 12 '^## B-NNN ' docs/backlog-done.md` で 1 項目だけ読む。
実機で確かめられる事実（MySQL の挙動、ツールの有無など）は、聞かずにここで確かめる。
対象が複数のときは、全部を調べ終えてから次へ進む。

1つの PR に収まらない大きさの項目は、確定せず、`mgmt-backlog` の「項目の大きさ」に従って分割を提案する。"""

[[states.research.choices]]
label = "ok"
when = "確定に進める項目が 1 つ以上ある（分割を提案した項目があれば、それは除く）"
goto = "ask"

[[states.research.choices]]
label = "none_left"
when = "全ての項目が大きすぎて、確定に進める項目が無い"
goto = "report"

[states.ask]
prompt = """質問をまとめて聞く。調べても残る不明点のうち、次のものだけを `AskUserQuestion` で聞く（推奨案を先頭に）。
- 検証できない受け入れ条件
- 複数の案があり、好みや方針で決まるもの（フラグ名、既定値、互換性など）

一般的な既定値で決められるものは聞かず、「前提」として決める。聞くことが無ければ聞かない。
1回の呼び出しは4問までなので、超える分は項目ごとに呼び出しを分ける。質問には項目の ID を入れる。"""
goto = "record"

[states.record]
prompt = """記録して `ready` にする。対象のブロックだけを書き換える。
- `- 仕様:` に、答えと前提を箇条書きで書く。前提には「前提:」を付ける。`impl-backlog` が着手時に確かめ直せるよう、前提は関数名やファイル名などの確かめられる形で書く。
- 受け入れ条件を、確定した仕様に合わせて直す。
- 概要には書き足さない（調査の経緯は書かない。要るなら設計書に書く）。
- 見出しを `[ready|Pn]` にする。

答えが得られなかった質問が残る項目は `todo` のままにする。"""
goto = "report"

[states.report]
prompt = """報告する。`ready` にした項目と、確定した仕様・置いた前提を日本語で要約する。`ready` にしなかった項目は、その理由を伝える。
別のセッションや worktree の `impl-backlog` が `ready` を見られるのは、`origin/main` に入ってからなので、そのことを伝える。"""
end = true
