name: main

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: wtnb75/actions/golang@v1
    - uses: wtnb75/actions/gotest@v1
      with:
        html-output-dir: coverage
    # Collects the coverage HTML into publish/coverage and uploads it as the Pages artifact.
    - uses: wtnb75/actions/merge-pages@v1
      with:
        dirs: coverage
    - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

  # Publishes the coverage report at https://<owner>.github.io/<repo>/coverage/.
  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  integration:
    uses: ./.github/workflows/integration.yml

  image:
    # Publish only commits that passed the tests.
    needs: [test, integration]
    uses: ./.github/workflows/image.yml
    with:
      push: true
    permissions:
      contents: read
      packages: write
